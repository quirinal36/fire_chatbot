name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      # next build 가 next-env.d.ts 와 라우트 타입을 만든 뒤에 타입 검사를 한다.
      # 환경변수는 요청 시점에 검증하므로 빌드에 비밀값이 필요 없다.
      - run: npm run build
      - run: npm run typecheck

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env.example 에 값이 들어가지 않았는지 확인
        run: |
          leaked=$(grep -hnE '^[A-Z_]+=.+' .env.example | grep -vE '^[0-9]+:(NEXT_PUBLIC_SUPABASE_URL|SUPABASE_URL|EMBEDDING_MODEL|EMBEDDING_DIMENSIONS)=' || true)
          if [ -n "$leaked" ]; then echo "::error::.env.example 에 값이 있습니다"; echo "$leaked" | cut -d= -f1; exit 1; fi
