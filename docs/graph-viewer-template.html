<title>소방 챗봇 지식 그래프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{
  --surface-base:#faf9f5; --surface-raised:#fff; --surface-sunken:#f0eee6;
  --border-subtle:#e5e2d9; --border-strong:#ddd9cd;
  --ink:#141413; --ink-muted:#5e5d59;
  --accent:#b5532f; --accent-soft:#d97757; --on-accent:#fff;
  --c-code:#b5532f; --c-document:#2f6f5e; --c-concept:#4a5c8a; --c-rationale:#8a6d2f;
  --edge:#c9c4b5; --edge-inferred:#b5532f;
  --font-sans:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --font-serif:'Noto Serif KR','Apple SD Gothic Neo',serif;
  --shadow:0 2px 8px rgba(20,20,19,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface-base:#1b1a17; --surface-raised:#24231f; --surface-sunken:#2c2a25;
  --border-subtle:#37352e; --border-strong:#45423a;
  --ink:#f3f0e8; --ink-muted:#a8a49a;
  --accent:#e08a63; --accent-soft:#f0a583; --on-accent:#1b1a17;
  --c-code:#e08a63; --c-document:#6cbfa6; --c-concept:#8fa3d4; --c-rationale:#cfa85f;
  --edge:#454239; --edge-inferred:#e08a63;
  --shadow:0 2px 8px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --surface-base:#1b1a17; --surface-raised:#24231f; --surface-sunken:#2c2a25;
  --border-subtle:#37352e; --border-strong:#45423a;
  --ink:#f3f0e8; --ink-muted:#a8a49a;
  --accent:#e08a63; --accent-soft:#f0a583; --on-accent:#1b1a17;
  --c-code:#e08a63; --c-document:#6cbfa6; --c-concept:#8fa3d4; --c-rationale:#cfa85f;
  --edge:#454239; --edge-inferred:#e08a63;
  --shadow:0 2px 8px rgba(0,0,0,.3);
}
html,body{height:100%}
body{margin:0;background:var(--surface-base);color:var(--ink);
  font:400 14px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}

.shell{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---- header ---- */
.top{padding:14px 16px 12px;border-bottom:1px solid var(--border-subtle);
  background:var(--surface-raised);display:flex;flex-direction:column;gap:10px;flex:none}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 19px/1.25 var(--font-serif);text-wrap:balance}
.commit{font:400 11px/1.4 var(--font-sans);color:var(--ink-muted);
  font-variant-numeric:tabular-nums}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:5px}
.stat b{font:700 17px/1.2 var(--font-sans);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-muted)}
.finding{margin:0;padding:9px 12px;
  border-left:3px solid var(--accent);background:var(--surface-sunken);
  border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.6}
.finding b{color:var(--accent)}

/* ---- body ---- */
.main{flex:1;display:flex;min-height:0}

.rail{width:252px;flex:none;border-right:1px solid var(--border-subtle);
  background:var(--surface-raised);overflow-y:auto;padding:14px 14px 24px;
  display:flex;flex-direction:column;gap:18px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>h2{margin:0;font:600 11px/1.4 var(--font-sans);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-muted)}
#q{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;
  background:var(--surface-base);color:var(--ink);font:inherit;font-size:13px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--border-strong);background:var(--surface-base);cursor:pointer;
  font-size:12px;line-height:1.3}
.chip:hover{border-color:var(--ink-muted)}
.chip[aria-pressed="false"]{opacity:.42}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .n{color:var(--ink-muted);font-variant-numeric:tabular-nums;font-size:11px}
.clist{display:flex;flex-direction:column;gap:2px}
.crow{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;
  border:none;background:none;cursor:pointer;text-align:left;width:100%;font-size:12.5px}
.crow:hover{background:var(--surface-sunken)}
.crow[aria-pressed="false"]{opacity:.4}
.crow .bar{width:3px;align-self:stretch;border-radius:2px;flex:none;min-height:16px}
.crow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .n{color:var(--ink-muted);font-variant-numeric:tabular-nums;font-size:11px}
.railbtns{display:flex;gap:6px}
.tbtn{flex:1;padding:6px 8px;border:1px solid var(--border-strong);border-radius:7px;
  background:var(--surface-base);cursor:pointer;font-size:12px}
.tbtn:hover{border-color:var(--ink-muted)}
.hyper{display:flex;flex-direction:column;gap:3px}
.hbtn{text-align:left;padding:6px 8px;border:1px solid var(--border-subtle);border-radius:7px;
  background:var(--surface-base);cursor:pointer;font-size:12px;line-height:1.4}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}

.canvaswrap{flex:1;position:relative;min-width:0;background:var(--surface-base)}
#net{position:absolute;inset:0}
.hint{position:absolute;left:14px;bottom:12px;font-size:11.5px;color:var(--ink-muted);
  background:var(--surface-raised);border:1px solid var(--border-subtle);
  padding:5px 9px;border-radius:7px;pointer-events:none;max-width:calc(100% - 28px)}

.insp{width:296px;flex:none;border-left:1px solid var(--border-subtle);
  background:var(--surface-raised);overflow-y:auto;padding:16px 16px 28px}
.empty{color:var(--ink-muted);font-size:12.5px;line-height:1.7}
.ntitle{margin:0 0 4px;font:700 15px/1.4 var(--font-sans);word-break:break-word}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}
.badge{padding:3px 8px;border-radius:999px;font-size:11px;line-height:1.5;
  background:var(--surface-sunken);border:1px solid var(--border-subtle)}
.badge.type{color:var(--on-accent);border:none}
.meta{font-size:12px;color:var(--ink-muted);word-break:break-all;margin:0 0 12px;
  font-variant-numeric:tabular-nums}
.why{padding:10px 12px;background:var(--surface-sunken);border-radius:8px;
  font-size:12.5px;line-height:1.65;margin:0 0 14px}
.why h3{margin:0 0 5px;font:600 11px/1.4 var(--font-sans);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-muted)}
.rel h3{margin:0 0 7px;font:600 11px/1.4 var(--font-sans);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-muted)}
.rel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.rel li{display:flex;gap:7px;align-items:baseline;font-size:12.5px;line-height:1.5}
.rel .rl{flex:none;font-size:10.5px;color:var(--ink-muted);padding:1px 5px;
  background:var(--surface-sunken);border-radius:4px;white-space:nowrap}
.rel button{background:none;border:none;padding:0;cursor:pointer;text-align:left;
  text-decoration:underline;text-decoration-color:var(--border-strong);
  text-underline-offset:2px;word-break:break-word}
.rel button:hover{color:var(--accent);text-decoration-color:var(--accent)}
.inf{color:var(--accent);font-size:10.5px}

@media (max-width:900px){
  .main{flex-direction:column}
  .canvaswrap{order:1;min-height:62vh}
  .rail{order:2;width:auto;border-right:none;
    border-top:1px solid var(--border-subtle);max-height:none;overflow:visible}
  .insp{order:3;width:auto;border-left:none;border-top:1px solid var(--border-subtle)}
  .clist{max-height:210px;overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>소방 챗봇 지식 그래프</h1>
      <span class="commit" id="commit"></span>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-n"></b><span>노드</span></div>
      <div class="stat"><b id="s-e"></b><span>엣지</span></div>
      <div class="stat"><b id="s-c"></b><span>커뮤니티</span></div>
      <div class="stat"><b id="s-f"></b><span>파일</span></div>
      <div class="stat"><b id="s-i"></b><span>추론 엣지</span></div>
    </div>
    <p class="finding">
      기획서·문서 쪽 <b id="f-plan"></b>개 노드와 프런트엔드 코드 <b id="f-code"></b>개 노드를 잇는 엣지가
      <b>0개</b>입니다. 코드에 이슈 번호나 기획서 절 참조가 없어서, 두 덩어리가 서로를 모릅니다.
    </p>
  </header>

  <div class="main">
    <aside class="rail">
      <div class="grp">
        <h2>검색</h2>
        <input id="q" type="search" placeholder="노드 이름 · 파일 경로" autocomplete="off">
      </div>
      <div class="grp">
        <h2>종류</h2>
        <div class="chips" id="types"></div>
      </div>
      <div class="grp">
        <h2>엣지</h2>
        <div class="chips" id="confs"></div>
      </div>
      <div class="grp">
        <h2>커뮤니티</h2>
        <div class="railbtns">
          <button class="tbtn" id="all">전체</button>
          <button class="tbtn" id="none">해제</button>
        </div>
        <div class="clist" id="comms"></div>
      </div>
      <div class="grp">
        <h2>함께 묶인 흐름</h2>
        <div class="hyper" id="hyper"></div>
      </div>
    </aside>

    <div class="canvaswrap">
      <div id="net"></div>
      <p class="hint">노드를 누르면 오른쪽에 상세가 열립니다. 점선 엣지는 추론(INFERRED)입니다.</p>
    </div>

    <aside class="insp" id="insp">
      <p class="empty">노드를 선택하세요.<br>왼쪽에서 종류·커뮤니티를 걸러 볼 수 있습니다.</p>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.6/standalone/umd/vis-network.min.js"></script>
<script>
const DATA = __DATA__;

const TYPE_LABEL = {code:'코드', document:'문서', concept:'개념', rationale:'설계 근거'};
const TYPES = ['code','document','concept','rationale'];
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const typeColor = (t) => css('--c-' + t) || css('--ink-muted');

const byId = new Map(DATA.nodes.map(n => [n.i, n]));
const deg = new Map();
DATA.links.forEach(l => {
  deg.set(l.s, (deg.get(l.s) || 0) + 1);
  deg.set(l.d, (deg.get(l.d) || 0) + 1);
});
const nbrs = new Map();
DATA.links.forEach(l => {
  if (!nbrs.has(l.s)) nbrs.set(l.s, []);
  if (!nbrs.has(l.d)) nbrs.set(l.d, []);
  nbrs.get(l.s).push({o: l.d, r: l.r, c: l.c, dir: '→'});
  nbrs.get(l.d).push({o: l.s, r: l.r, c: l.c, dir: '←'});
});

// ---- header numbers ----
const files = new Set(DATA.nodes.map(n => n.f).filter(Boolean));
const inferred = DATA.links.filter(l => l.c === 'INFERRED').length;
document.getElementById('s-n').textContent = DATA.nodes.length;
document.getElementById('s-e').textContent = DATA.links.length;
document.getElementById('s-c').textContent = Object.keys(DATA.communities).length;
document.getElementById('s-f').textContent = files.size;
document.getElementById('s-i').textContent = inferred;
document.getElementById('commit').textContent = DATA.commit ? DATA.commit.slice(0, 7) : '';

const isCode = (n) => (n.f || '').startsWith('frontend/') &&
  !/README\.md$|index\.html$/.test(n.f || '');
const isPlan = (n) => (n.f || '').startsWith('docs/') || /기획서\.md$/.test(n.f || '');
document.getElementById('f-plan').textContent = DATA.nodes.filter(isPlan).length;
document.getElementById('f-code').textContent = DATA.nodes.filter(isCode).length;

// ---- filter state ----
const active = {
  types: new Set(TYPES),
  confs: new Set(['EXTRACTED', 'INFERRED']),
  comms: new Set(Object.keys(DATA.communities).map(Number)),
  q: ''
};

// ---- type chips ----
const typeCount = {};
DATA.nodes.forEach(n => { typeCount[n.t] = (typeCount[n.t] || 0) + 1; });
const typesEl = document.getElementById('types');
TYPES.forEach(t => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed', 'true');
  b.innerHTML = '<span class="dot" style="background:' + typeColor(t) + '"></span>' +
    TYPE_LABEL[t] + ' <span class="n">' + (typeCount[t] || 0) + '</span>';
  b.onclick = () => {
    active.types.has(t) ? active.types.delete(t) : active.types.add(t);
    b.setAttribute('aria-pressed', String(active.types.has(t)));
    apply();
  };
  typesEl.appendChild(b);
});

// ---- confidence chips ----
const confsEl = document.getElementById('confs');
[['EXTRACTED', '추출 ' + (DATA.links.length - inferred)], ['INFERRED', '추론 ' + inferred]]
  .forEach(([k, lbl]) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed', 'true');
    b.textContent = lbl;
    b.onclick = () => {
      active.confs.has(k) ? active.confs.delete(k) : active.confs.add(k);
      b.setAttribute('aria-pressed', String(active.confs.has(k)));
      apply();
    };
    confsEl.appendChild(b);
  });

// ---- community rows ----
const commCount = {};
DATA.nodes.forEach(n => { commCount[n.c] = (commCount[n.c] || 0) + 1; });
const commsEl = document.getElementById('comms');
const commBtns = new Map();
Object.entries(DATA.communities)
  .sort((a, b) => (commCount[b[0]] || 0) - (commCount[a[0]] || 0))
  .forEach(([cid, name]) => {
    const id = Number(cid);
    const b = document.createElement('button');
    b.className = 'crow'; b.type = 'button'; b.setAttribute('aria-pressed', 'true');
    b.title = name;
    b.innerHTML = '<span class="bar" style="background:' + commColor(id) + '"></span>' +
      '<span class="nm"></span><span class="n">' + (commCount[cid] || 0) + '</span>';
    b.querySelector('.nm').textContent = name;
    b.onclick = () => {
      active.comms.has(id) ? active.comms.delete(id) : active.comms.add(id);
      b.setAttribute('aria-pressed', String(active.comms.has(id)));
      apply();
    };
    commBtns.set(id, b);
    commsEl.appendChild(b);
  });
document.getElementById('all').onclick = () => {
  Object.keys(DATA.communities).forEach(c => active.comms.add(Number(c)));
  commBtns.forEach(b => b.setAttribute('aria-pressed', 'true'));
  apply();
};
document.getElementById('none').onclick = () => {
  active.comms.clear();
  commBtns.forEach(b => b.setAttribute('aria-pressed', 'false'));
  apply();
};

function commColor(cid) {
  const h = (Number(cid) * 47) % 360;
  return 'hsl(' + h + ' 34% 52%)';
}

// ---- hyperedges ----
const hyperEl = document.getElementById('hyper');
DATA.hyperedges.forEach(h => {
  const b = document.createElement('button');
  b.className = 'hbtn'; b.type = 'button';
  b.textContent = h.l + ' · ' + h.n.length;
  b.onclick = () => {
    const ids = h.n.filter(i => byId.has(i));
    if (!ids.length) return;
    net.selectNodes(ids);
    net.fit({nodes: ids, animation: !reduced});
    if (ids.length) showNode(ids[0]);
  };
  hyperEl.appendChild(b);
});

// ---- network ----
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const nodesDS = new vis.DataSet(DATA.nodes.map(n => ({
  id: n.i,
  label: (deg.get(n.i) || 0) >= 4
    ? (n.l.length > 26 ? n.l.slice(0, 25) + '…' : n.l)
    : undefined,
  title: n.l + (n.f ? '\n' + n.f + (n.n ? ':' + n.n : '') : ''),
  value: (deg.get(n.i) || 0) + 1,
  color: nodeColor(n),
  font: {color: css('--ink'), face: 'Noto Sans KR, sans-serif', size: 13}
})));
const edgesDS = new vis.DataSet(DATA.links.map((l, k) => ({
  id: k, from: l.s, to: l.d,
  title: l.r + ' · ' + l.c,
  dashes: l.c === 'INFERRED',
  color: {color: l.c === 'INFERRED' ? css('--edge-inferred') : css('--edge'),
          opacity: l.c === 'INFERRED' ? 0.75 : 0.5},
  width: l.c === 'INFERRED' ? 1.4 : 1
})));

function nodeColor(n) {
  const c = typeColor(n.t);
  return {background: c, border: c, highlight: {background: css('--accent-soft'), border: css('--ink')}};
}

const net = new vis.Network(document.getElementById('net'),
  {nodes: nodesDS, edges: edgesDS}, {
  nodes: {shape: 'dot', scaling: {min: 7, max: 34, label: {enabled: true, min: 11, max: 17}},
          borderWidth: 0},
  edges: {smooth: {type: 'continuous', roundness: 0.2}},
  physics: {enabled: true, stabilization: {iterations: 260, fit: true},
            barnesHut: {gravitationalConstant: -7200, springLength: 118,
                        springConstant: 0.035, damping: 0.42, avoidOverlap: 0.16}},
  interaction: {hover: true, tooltipDelay: 180, navigationButtons: false, keyboard: false}
});
net.once('stabilizationIterationsDone', () => net.setOptions({physics: {enabled: false}}));

// ---- filtering ----
function visible(n) {
  if (!active.types.has(n.t)) return false;
  if (!active.comms.has(n.c)) return false;
  if (active.q) {
    const hay = (n.l + ' ' + (n.f || '')).toLowerCase();
    if (!hay.includes(active.q)) return false;
  }
  return true;
}
function apply() {
  const shown = new Set();
  const nUpd = DATA.nodes.map(n => {
    const v = visible(n);
    if (v) shown.add(n.i);
    return {id: n.i, hidden: !v};
  });
  nodesDS.update(nUpd);
  edgesDS.update(DATA.links.map((l, k) => ({
    id: k,
    hidden: !(shown.has(l.s) && shown.has(l.d) && active.confs.has(l.c))
  })));
}
let qt;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(qt);
  qt = setTimeout(() => { active.q = e.target.value.trim().toLowerCase(); apply(); }, 160);
});

// ---- inspector ----
const insp = document.getElementById('insp');
net.on('click', (p) => {
  if (p.nodes.length) showNode(p.nodes[0]);
});

function showNode(id) {
  const n = byId.get(id);
  if (!n) return;
  net.selectNodes([id]);
  const list = (nbrs.get(id) || [])
    .filter(x => byId.has(x.o))
    .sort((a, b) => (deg.get(b.o) || 0) - (deg.get(a.o) || 0));

  const el = document.createElement('div');

  const h = document.createElement('h2');
  h.className = 'ntitle';
  h.textContent = n.l;
  el.appendChild(h);

  const badges = document.createElement('div');
  badges.className = 'badges';
  const tb = document.createElement('span');
  tb.className = 'badge type';
  tb.style.background = typeColor(n.t);
  tb.style.color = css('--on-accent');
  tb.textContent = TYPE_LABEL[n.t] || n.t;
  badges.appendChild(tb);
  const cb = document.createElement('span');
  cb.className = 'badge';
  cb.textContent = DATA.communities[n.c] || ('커뮤니티 ' + n.c);
  badges.appendChild(cb);
  const db = document.createElement('span');
  db.className = 'badge';
  db.textContent = '연결 ' + (deg.get(id) || 0);
  badges.appendChild(db);
  if (n.o === 'ast') {
    const ob = document.createElement('span');
    ob.className = 'badge';
    ob.textContent = 'AST 추출';
    badges.appendChild(ob);
  }
  el.appendChild(badges);

  if (n.f) {
    const m = document.createElement('p');
    m.className = 'meta';
    m.textContent = n.f + (n.n ? ' · ' + n.n : '');
    el.appendChild(m);
  }

  if (n.r) {
    const w = document.createElement('div');
    w.className = 'why';
    const wh = document.createElement('h3');
    wh.textContent = '설계 근거';
    w.appendChild(wh);
    const wp = document.createElement('div');
    wp.textContent = n.r;
    w.appendChild(wp);
    el.appendChild(w);
  }

  const rel = document.createElement('div');
  rel.className = 'rel';
  const rh = document.createElement('h3');
  rh.textContent = '연결된 노드 ' + list.length;
  rel.appendChild(rh);
  const ul = document.createElement('ul');
  list.forEach(x => {
    const li = document.createElement('li');
    const tag = document.createElement('span');
    tag.className = 'rl';
    tag.textContent = x.dir + ' ' + x.r;
    li.appendChild(tag);
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = byId.get(x.o).l;
    b.onclick = () => { showNode(x.o); net.focus(x.o, {scale: 1.1, animation: !reduced}); };
    li.appendChild(b);
    if (x.c === 'INFERRED') {
      const i = document.createElement('span');
      i.className = 'inf';
      i.textContent = '추론';
      li.appendChild(i);
    }
    ul.appendChild(li);
  });
  rel.appendChild(ul);
  el.appendChild(rel);

  insp.replaceChildren(el);
  insp.scrollTop = 0;
}

// ---- theme repaint ----
function repaint() {
  nodesDS.update(DATA.nodes.map(n => ({
    id: n.i, color: nodeColor(n),
    font: {color: css('--ink'), face: 'Noto Sans KR, sans-serif', size: 13}
  })));
  edgesDS.update(DATA.links.map((l, k) => ({
    id: k,
    color: {color: l.c === 'INFERRED' ? css('--edge-inferred') : css('--edge'),
            opacity: l.c === 'INFERRED' ? 0.75 : 0.5}
  })));
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(repaint, 60));
new MutationObserver(() => setTimeout(repaint, 60))
  .observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

// 첫 화면부터 무엇을 보는 그래프인지 드러나도록 가장 연결이 많은 노드를 열어 둡니다.
const seed = DATA.nodes.slice().sort((a, b) => (deg.get(b.i) || 0) - (deg.get(a.i) || 0))[0];
if (seed) showNode(seed.i);
</script>
