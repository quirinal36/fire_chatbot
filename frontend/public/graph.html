<title>소방 챗봇 지식 그래프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{
  --surface-base:#faf9f5; --surface-raised:#fff; --surface-sunken:#f0eee6;
  --border-subtle:#e5e2d9; --border-strong:#ddd9cd;
  --ink:#141413; --ink-muted:#5e5d59;
  --accent:#b5532f; --accent-soft:#d97757; --on-accent:#fff;
  --c-code:#b5532f; --c-document:#2f6f5e; --c-concept:#4a5c8a; --c-rationale:#8a6d2f;
  --edge:#c9c4b5; --edge-inferred:#b5532f;
  --font-sans:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --font-serif:'Noto Serif KR','Apple SD Gothic Neo',serif;
  --shadow:0 2px 8px rgba(20,20,19,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface-base:#1b1a17; --surface-raised:#24231f; --surface-sunken:#2c2a25;
  --border-subtle:#37352e; --border-strong:#45423a;
  --ink:#f3f0e8; --ink-muted:#a8a49a;
  --accent:#e08a63; --accent-soft:#f0a583; --on-accent:#1b1a17;
  --c-code:#e08a63; --c-document:#6cbfa6; --c-concept:#8fa3d4; --c-rationale:#cfa85f;
  --edge:#454239; --edge-inferred:#e08a63;
  --shadow:0 2px 8px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --surface-base:#1b1a17; --surface-raised:#24231f; --surface-sunken:#2c2a25;
  --border-subtle:#37352e; --border-strong:#45423a;
  --ink:#f3f0e8; --ink-muted:#a8a49a;
  --accent:#e08a63; --accent-soft:#f0a583; --on-accent:#1b1a17;
  --c-code:#e08a63; --c-document:#6cbfa6; --c-concept:#8fa3d4; --c-rationale:#cfa85f;
  --edge:#454239; --edge-inferred:#e08a63;
  --shadow:0 2px 8px rgba(0,0,0,.3);
}
html,body{height:100%}
body{margin:0;background:var(--surface-base);color:var(--ink);
  font:400 14px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}

.shell{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---- header ---- */
.top{padding:14px 16px 12px;border-bottom:1px solid var(--border-subtle);
  background:var(--surface-raised);display:flex;flex-direction:column;gap:10px;flex:none}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 19px/1.25 var(--font-serif);text-wrap:balance}
.commit{font:400 11px/1.4 var(--font-sans);color:var(--ink-muted);
  font-variant-numeric:tabular-nums}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:5px}
.stat b{font:700 17px/1.2 var(--font-sans);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-muted)}
.finding{margin:0;padding:9px 12px;
  border-left:3px solid var(--accent);background:var(--surface-sunken);
  border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.6}
.finding b{color:var(--accent)}

/* ---- body ---- */
.main{flex:1;display:flex;min-height:0}

.rail{width:252px;flex:none;border-right:1px solid var(--border-subtle);
  background:var(--surface-raised);overflow-y:auto;padding:14px 14px 24px;
  display:flex;flex-direction:column;gap:18px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>h2{margin:0;font:600 11px/1.4 var(--font-sans);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-muted)}
#q{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;
  background:var(--surface-base);color:var(--ink);font:inherit;font-size:13px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--border-strong);background:var(--surface-base);cursor:pointer;
  font-size:12px;line-height:1.3}
.chip:hover{border-color:var(--ink-muted)}
.chip[aria-pressed="false"]{opacity:.42}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .n{color:var(--ink-muted);font-variant-numeric:tabular-nums;font-size:11px}
.clist{display:flex;flex-direction:column;gap:2px}
.crow{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;
  border:none;background:none;cursor:pointer;text-align:left;width:100%;font-size:12.5px}
.crow:hover{background:var(--surface-sunken)}
.crow[aria-pressed="false"]{opacity:.4}
.crow .bar{width:3px;align-self:stretch;border-radius:2px;flex:none;min-height:16px}
.crow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .n{color:var(--ink-muted);font-variant-numeric:tabular-nums;font-size:11px}
.railbtns{display:flex;gap:6px}
.tbtn{flex:1;padding:6px 8px;border:1px solid var(--border-strong);border-radius:7px;
  background:var(--surface-base);cursor:pointer;font-size:12px}
.tbtn:hover{border-color:var(--ink-muted)}
.hyper{display:flex;flex-direction:column;gap:3px}
.hbtn{text-align:left;padding:6px 8px;border:1px solid var(--border-subtle);border-radius:7px;
  background:var(--surface-base);cursor:pointer;font-size:12px;line-height:1.4}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}

.canvaswrap{flex:1;position:relative;min-width:0;background:var(--surface-base)}
#net{position:absolute;inset:0}
.hint{position:absolute;left:14px;bottom:12px;font-size:11.5px;color:var(--ink-muted);
  background:var(--surface-raised);border:1px solid var(--border-subtle);
  padding:5px 9px;border-radius:7px;pointer-events:none;max-width:calc(100% - 28px)}

.insp{width:296px;flex:none;border-left:1px solid var(--border-subtle);
  background:var(--surface-raised);overflow-y:auto;padding:16px 16px 28px}
.empty{color:var(--ink-muted);font-size:12.5px;line-height:1.7}
.ntitle{margin:0 0 4px;font:700 15px/1.4 var(--font-sans);word-break:break-word}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}
.badge{padding:3px 8px;border-radius:999px;font-size:11px;line-height:1.5;
  background:var(--surface-sunken);border:1px solid var(--border-subtle)}
.badge.type{color:var(--on-accent);border:none}
.meta{font-size:12px;color:var(--ink-muted);word-break:break-all;margin:0 0 12px;
  font-variant-numeric:tabular-nums}
.why{padding:10px 12px;background:var(--surface-sunken);border-radius:8px;
  font-size:12.5px;line-height:1.65;margin:0 0 14px}
.why h3{margin:0 0 5px;font:600 11px/1.4 var(--font-sans);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-muted)}
.rel h3{margin:0 0 7px;font:600 11px/1.4 var(--font-sans);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-muted)}
.rel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.rel li{display:flex;gap:7px;align-items:baseline;font-size:12.5px;line-height:1.5}
.rel .rl{flex:none;font-size:10.5px;color:var(--ink-muted);padding:1px 5px;
  background:var(--surface-sunken);border-radius:4px;white-space:nowrap}
.rel button{background:none;border:none;padding:0;cursor:pointer;text-align:left;
  text-decoration:underline;text-decoration-color:var(--border-strong);
  text-underline-offset:2px;word-break:break-word}
.rel button:hover{color:var(--accent);text-decoration-color:var(--accent)}
.inf{color:var(--accent);font-size:10.5px}

@media (max-width:900px){
  .main{flex-direction:column}
  .canvaswrap{order:1;min-height:62vh}
  .rail{order:2;width:auto;border-right:none;
    border-top:1px solid var(--border-subtle);max-height:none;overflow:visible}
  .insp{order:3;width:auto;border-left:none;border-top:1px solid var(--border-subtle)}
  .clist{max-height:210px;overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>소방 챗봇 지식 그래프</h1>
      <span class="commit" id="commit"></span>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-n"></b><span>노드</span></div>
      <div class="stat"><b id="s-e"></b><span>엣지</span></div>
      <div class="stat"><b id="s-c"></b><span>커뮤니티</span></div>
      <div class="stat"><b id="s-f"></b><span>파일</span></div>
      <div class="stat"><b id="s-i"></b><span>추론 엣지</span></div>
    </div>
    <p class="finding">
      기획서·문서 쪽 <b id="f-plan"></b>개 노드와 프런트엔드 코드 <b id="f-code"></b>개 노드를 잇는 엣지가
      <b>0개</b>입니다. 코드에 이슈 번호나 기획서 절 참조가 없어서, 두 덩어리가 서로를 모릅니다.
    </p>
  </header>

  <div class="main">
    <aside class="rail">
      <div class="grp">
        <h2>검색</h2>
        <input id="q" type="search" placeholder="노드 이름 · 파일 경로" autocomplete="off">
      </div>
      <div class="grp">
        <h2>종류</h2>
        <div class="chips" id="types"></div>
      </div>
      <div class="grp">
        <h2>엣지</h2>
        <div class="chips" id="confs"></div>
      </div>
      <div class="grp">
        <h2>커뮤니티</h2>
        <div class="railbtns">
          <button class="tbtn" id="all">전체</button>
          <button class="tbtn" id="none">해제</button>
        </div>
        <div class="clist" id="comms"></div>
      </div>
      <div class="grp">
        <h2>함께 묶인 흐름</h2>
        <div class="hyper" id="hyper"></div>
      </div>
    </aside>

    <div class="canvaswrap">
      <div id="net"></div>
      <p class="hint">노드를 누르면 오른쪽에 상세가 열립니다. 점선 엣지는 추론(INFERRED)입니다.</p>
    </div>

    <aside class="insp" id="insp">
      <p class="empty">노드를 선택하세요.<br>왼쪽에서 종류·커뮤니티를 걸러 볼 수 있습니다.</p>
    </aside>
  </div>
</div>

ot_plan_answer_runs","l":"answer_runs (모델·프롬프트 버전·근거·비용 기록)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5","r":"답변의 판단 경로를 재현하려면 모델·프롬프트 버전, 사용 근거 ID, 규칙 버전, 입력 스냅샷을 함께 남겨야 한다."},{"i":"fire_chatbot_plan_answerenvelope","l":"AnswerEnvelope (서버 결합 응답)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.3","r":"LLM이 새로 판정하거나 URL을 작성하지 않는다. assessment·sources·corpusVersion은 서버가 DB에서 조립한다."},{"i":"fire_chatbot_plan_budget_allocation","l":"2,000만원 예산 배분안","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§12","r":"외부 서비스 견적이나 고정 가격이 아닌 총액 내 작업 배분안. 부가세·클라우드 운영비가 총액에 포함된다면 그 금액을 먼저 유보하고 개발 범위를 조정한다."},{"i":"fire_chatbot_plan_building_cases","l":"building_cases · case revision","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5, §6.2, §8","r":"조건이 달라지면 revision을 증가시켜 기존 판단 캐시를 무효화하고, 케이스 수정 충돌도 revision 조건으로 감지한다."},{"i":"fire_chatbot_plan_chatanswer","l":"ChatAnswer 응답 타입","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.3"},{"i":"fire_chatbot_plan_citation_validation","l":"인용·스키마 검증 (Zod · ID 소속 확인 · URL 서버 조립)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.3, §10","r":"인용 ID의 존재만으로 문장과 근거의 의미 일치가 보장되지 않는다. 결론·숫자·조건은 규칙 템플릿으로 표시하고 자유 설명의 근거 충실성은 평가 데이터로 검증한다. 검증 실패 시 제한된 재시도 1회 후 근거 목록과 추가 확인 안내를 반환한다."},{"i":"fire_chatbot_plan_condition_fields","l":"건물·영업장 조건 입력 모델 (unknown/extracted/user_confirmed)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§7","r":"최초부터 전 항목을 요구하지 않고 관련 규칙이 요구하는 것만 추가로 묻는다. 필수 여부는 소방 담당자가 검토한 판단표에서 정한다."},{"i":"fire_chatbot_plan_connection_test","l":"최초 연결 시험 절차","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§4.3","r":"HTTP 200으로 오류 HTML이 오는 경우가 있으므로 상태코드만으로 성공을 기록하지 않고 Content-Type·오류 본문·결과 수·ID·실제 본문 존재까지 확인한다. Vercel Preview에서도 동일 시험을 수행해 송신 IP 제약 여부를 조기에 확인한다."},{"i":"fire_chatbot_plan_cost_model","l":"월 모델비 산식과 PoC 토큰 측정","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§12","r":"확인하지 않은 현재 요금을 기입하지 않고, PoC 100개 질문의 평균·p95 토큰과 비용을 측정한 뒤 월 1,000/10,000/50,000회 시나리오로 환산한다. 대화 문맥 증가와 재시도 비용도 포함한다."},{"i":"fire_chatbot_plan_declarative_rules","l":"선언형 규칙 엔진 (버전 관리 · eval 금지)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§7","r":"임의 문자열 eval을 쓰지 않고 버전 관리 가능한 선언형 JSON 또는 TypeScript 모듈로 시작한다. 규칙 결과에 검사한 입력·미확인 조건·예외 검사 결과·근거 조항·검토자·규칙 버전을 포함해 추적성을 확보한다. 관리자 범용 규칙 편집기는 1차 범위에서 제외하고 승인 화면만 제공한다."},{"i":"fire_chatbot_plan_eight_week_plan","l":"8주 구현 순서","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§11","r":"1인 개발 기준으로 규칙 범위와 자료 품질이 일정에 가장 크게 영향을 준다. 4주차 근거 검색 챗봇(수직 흐름 완성)을 첫 검토 지점으로 삼는다."},{"i":"fire_chatbot_plan_enforcement_decree_tables","l":"시행령 별표 구조화 (별표2 대상물·별표4 시설·별표5 면제)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§4.1"},{"i":"fire_chatbot_plan_env_secrets_policy","l":"환경변수·비밀값 운영 정책","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§9","r":"개발·Preview·운영 프로젝트와 키를 분리하고, 원천 API 쿼리의 OC와 Authorization 헤더는 로그에서 제거한다. 비밀값을 저장소나 브라우저 번들에 넣지 않는다."},{"i":"fire_chatbot_plan_hybrid_search","l":"하이브리드 검색 전략 (정확일치 + pg_trgm + pgvector + RRF)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.1","r":"한국어 법률 검색에 영어용 전문 검색 설정을 그대로 적용하지 않는다. 초기에는 정확 일치·pg_trgm·다국어 임베딩을 비교 평가하고 형태소 분석 도입은 검색 평가 결과로 결정한다. 후보 30, 최종 근거 6~10개는 확정값이 아닌 튜닝 시작값."},{"i":"fire_chatbot_plan_ingestion_jobs","l":"ingestion_jobs 작업 큐 (claim·lease·cursor·재시도)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5, §9","r":"Vercel 함수·Cron은 실행시간 제한이 있고 실패한 Cron 호출을 자동 재시도하지 않는다. 한 번의 함수에서 전체 수집을 하지 않고 DB에 진행 상태를 남기며, 프로세스 종료 뒤 작업이 계속된다고 가정하지 않는다."},{"i":"fire_chatbot_plan_ingestion_pipeline","l":"수집 파이프라인 (목록→선택→버전본문→원문저장→정규화→분해→인덱스→검토→게시)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§4.4","r":"검색어는 최초 발견용일 뿐 승인 근거가 아니다. totalCnt와 수집 건수를 대조해 첫 페이지 누락을 막고, 문서 ID·버전·원문 해시로 중복과 불필요한 재임베딩을 막는다."},{"i":"fire_chatbot_plan_law_go_kr_api","l":"국가법령정보 공동활용 OPEN API (law.go.kr/DRF)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§4.2","r":"인증값은 OC 요청변수로 전달하고 실제 키는 문서에 기록하지 않는다."},{"i":"fire_chatbot_plan_legal_documents","l":"legal_documents 테이블","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5"},{"i":"fire_chatbot_plan_legal_units","l":"legal_units 테이블","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5"},{"i":"fire_chatbot_plan_legal_versions","l":"legal_versions 테이블","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5"},{"i":"fire_chatbot_plan_model_failure_policy","l":"모델 선택·장애 처리·비용 상한","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.4","r":"특정 유료 모델을 지금 확정하지 않고 한국어 법령 질문·표 조건·모름 응답·JSON 준수·지연·비용으로 후보 2~3개를 비교한다. 429·5xx는 지수 백오프 재시도하되 인증 오류·잔액 부족은 반복 호출하지 않고 운영 오류로 분류한다. 실패 시 새 결론을 추정하지 않고 확보된 원문 근거를 보여준다."},{"i":"fire_chatbot_plan_nfpc_nftc","l":"화재안전성능기준(NFPC)·화재안전기술기준(NFTC)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§4.1","r":"행정규칙으로 수집한다. 법령의 별표와 행정규칙의 첨부를 동일한 파서로 처리할 수 있다고 가정하지 않는다."},{"i":"fire_chatbot_plan_open_decisions","l":"착수 전 확정 항목 7가지","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§14","r":"결정되지 않은 항목이 있어도 공개 법령 대상 수집·검색 PoC는 진행할 수 있다. 첫 개발 작업은 법령·NFPC·NFTC·별표의 실제 응답을 확보하고 한 질문에 올바른 근거를 반환하는 수직 기능을 만드는 것."},{"i":"fire_chatbot_plan_openrouter_contract","l":"OpenRouter 호출 계약 (chat/completions · 구조화 출력)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.3","r":"JSON Schema 응답을 지원하는 모델·provider만 허용하고 provider.require_parameters=true를 쓰되 실제 지원 여부와 결과를 검증한다."},{"i":"fire_chatbot_plan_repo_structure","l":"저장소 구조 제안 (src/lib/law-api, ingestion, retrieval, rules, chat, auth)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§13"},{"i":"fire_chatbot_plan_restaurant_pilot","l":"일반음식점 최초 적용 사례","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§1, §11, §14","r":"전체 업종을 한 번에 지원하면 규칙 검토량이 일정 밖으로 나가므로 단일 업종으로 좁혀 5주차에 결과 재현을 검증한다. 전체 범위는 담당자 협의 후 확정."},{"i":"fire_chatbot_plan_reviewer_workflow","l":"소방 담당자 검토·승인 워크플로","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§2.1, §7, §10","r":"소방 담당자 검토가 필요한 정답은 개발자가 단독으로 확정하지 않는다. 검토 일정이 늦어지면 검색 기능을 먼저 완성하고 미승인 판정은 공개하지 않는다."},{"i":"fire_chatbot_plan_rule_sets","l":"rule_sets / rules / rule_sources 테이블","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5"},{"i":"fire_chatbot_plan_search_chunks","l":"search_chunks 테이블 (embedding·visibility)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5"},{"i":"fire_chatbot_plan_server_api","l":"서버 API 경로 설계","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§8","r":"clientRequestId를 세션별 고유 키로 저장해 중복 생성과 중복 과금을 줄이고, 관리자 수집 API는 등록만 하며 즉시 전체 작업을 수행하지 않는다."},{"i":"fire_chatbot_plan_supabase_data_model","l":"Supabase 논리 데이터 모델","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5","r":"UUID 내부 키와 원천 문자열 ID를 분리하고 법령ID와 법령 일련번호를 혼용하지 않는다. 규칙 근거·답변 인용은 외래키로 무결성을 보장한다."},{"i":"fire_chatbot_plan_system_architecture","l":"시스템 구성도 (웹 → BFF → 규칙 → 검색 → 모델 → 검증)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§3","r":"웹 요청은 승인된 로컬 자료만 검색한다. 사용자 질문마다 법령 API를 대량 호출하지 않고 수집 작업을 대화 요청과 별도로 실행한다."},{"i":"fire_chatbot_plan_test_strategy","l":"fixture 기반 계약 테스트·파서·규칙 경계값·검색 평가","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§10, §13"},{"i":"fire_chatbot_plan_turn_pipeline","l":"한 턴의 처리 흐름 (인증→검증→조건추출→규칙→검색→생성→검증→기록)","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.2","r":"법령 일반 질문에는 불필요한 건물 입력을 강제하지 않고, 자연어에서 추출한 면적·층·용도는 출처 메시지와 함께 후보값으로만 저장한다."},{"i":"fire_chatbot_plan_ui_screens","l":"사용자·관리자 화면 구성","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§2.2, §8","r":"첫 화면은 '법령 질문'과 '내 영업장 기준 확인' 두 진입점으로 나눈다. 시설 적용 결과는 AI 본문과 별도의 표로 표시해 생성 텍스트와 규칙 판정을 시각적으로 분리한다."},{"i":"fire_chatbot_plan_vercel_cron_limits","l":"Vercel 서버리스·Cron 실행 제약","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§3, §9"},{"i":"fire_chatbot_plan_version_management","l":"현행·시행예정·연혁 버전 분리 관리","t":"concept","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§4.5","r":"신규 버전이 발견되어도 구버전을 덮어쓰지 않는다. 법령 시행일과 개별 건물의 적용 시점은 별개이므로 건축허가·용도변경 등 사건 날짜와 부칙을 함께 검토해야 하고, 과거 답변의 원문 버전을 재조회할 수 있어야 한다."},{"i":"fire_chatbot_plan_project","l":"소방시설 법령 API 기반 AI 안내 챗봇","t":"document","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§1","r":"소상공인이 건물·영업장 조건을 입력하면 법령 근거를 제시하는 챗봇. 답변 생성에 그치지 않고 근거 문서·버전·조항과 판단 경로를 재현 가능하게 만드는 것이 완료 목표."},{"i":"fire_chatbot_plan_data_governance","l":"내부 자료 공개·외부 모델 전송 승인 분리","t":"rationale","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§9","r":"소방본부 내부 자료의 외부 모델 전송 가능 여부가 미확정이므로, 검토 전에는 공개 법령과 비식별 테스트 사례로만 개발하고 '공개 승인'과 '외부 모델 전송 승인'을 별도 축으로 관리한다."},{"i":"fire_chatbot_plan_embedding_model_policy","l":"임베딩 모델 분리·재색인 전환 정책","t":"rationale","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.1","r":"챗 모델과 별도 ID·차원을 저장하고 질의와 문서에 같은 임베딩 체계를 사용한다. 모델 변경 시 기존 인덱스를 덮지 않고 새 인덱스를 만든 뒤 전환한다."},{"i":"fire_chatbot_plan_evidence_search_first","l":"근거 검색 우선 · 판정 분리 출시 전략","t":"rationale","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§1, §2.1","r":"검색 챗봇을 먼저 완성하고 담당자 검토가 끝난 범위에 한해서만 조건별 적용 판단을 추가한다. 검색 기능이 있다는 이유로 모든 건물의 설치대상을 판정할 수 있다고 표시하면 법적 오표시 위험이 크기 때문에 두 기능의 출시 수준을 분리한다."},{"i":"fire_chatbot_plan_needs_review_gate","l":"needs_review 게이트 · 추가 확인 필요 상태","t":"rationale","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§4.4, §4.5, §6.2","r":"표 추출이 불완전하거나 새 법령 버전이 반영되지 않은 항목을 자동 판단 근거로 게시하면 잘못된 확정 답변이 나간다. 이런 경우 결론을 내리는 대신 '추가 확인 필요'로 낮춘다. '비해당'은 검토된 규칙이 명확히 충족할 때만 나오며, 검색 결과가 없다는 이유로 비해당을 만들지 않는다."},{"i":"fire_chatbot_plan_prompt_injection_defense","l":"법령 원문·사용자 입력의 지시문 무력화","t":"rationale","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.3","r":"LLM에는 질문·확인된 조건·규칙 결과·허용된 근거만 전달하고 DB 쓰기나 임의 웹 검색 권한을 주지 않는다. 법령 원문·내부 파일·사용자 입력에 포함된 지시문은 시스템 지시로 해석하지 않는다."},{"i":"fire_chatbot_plan_rls_visibility","l":"RLS·공개범위 권한 분리","t":"rationale","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§5","r":"Supabase secret 키는 RLS를 우회하므로 서버 경로 자체에서 소유권과 관리자 권한을 검사해야 한다. 브라우저에 노출되는 테이블은 grants와 RLS를 함께 설정하고, 내부 자료는 검색 RPC에서도 공개 가능 범위를 강제한다."},{"i":"fire_chatbot_plan_sse_status_only","l":"1차 SSE 상태 스트리밍 (토큰 스트리밍 유보)","t":"rationale","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§6.3","r":"실제 토큰 스트리밍은 검증 전 내용이 사용자에게 노출되는 문제가 있어, 1차에는 '검색 중 / 설명 작성 중' 상태만 SSE로 보내고 검증된 최종 답변만 전달한다."},{"i":"fire_chatbot_plan_structural_chunking","l":"조문·항·호 기준 구조적 청킹","t":"rationale","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§4.4","r":"임의의 글자 수로 자르면 조항의 적용 조건과 비고가 분리되어 근거가 왜곡된다. 조문·항·호·기준 번호를 우선하고, 긴 항목을 나눌 때는 상위 제목과 적용 조건·비고를 각 조각에 연결한다."},{"i":"fire_chatbot_plan_target_adapter_isolation","l":"target별 어댑터 분리 원칙","t":"rationale","c":1,"f":"소방시설_법령_API_챗봇_프로그램_기획서.md","o":null,"n":"§4.2, §13","r":"법령의 nw=3과 행정규칙의 nw=1이 모두 '현행'을 뜻하지만 값이 다르고, ID 조회 본문과 MST·efYd 조회 본문의 계약도 다르다. 한 target의 필드·현행 구분값을 다른 target에 재사용하면 조용한 오수집이 발생하므로 src/lib/law-api/에 target별 어댑터를 따로 작성한다."},{"i":"docs_github_issues_answer_envelope","l":"ChatAnswer / AnswerEnvelope 구조화 응답 스키마","t":"concept","c":0,"f":"docs/github-issues.md","o":null},{"i":"docs_github_issues_case_revision","l":"영업장 조건 revision과 판단 캐시 무효화","t":"concept","c":0,"f":"docs/github-issues.md","o":null},{"i":"docs_github_issues_frontend_prototype","l":"frontend/ 채팅 화면 프로토타입 (Vite + TypeScript)","t":"concept","c":0,"f":"docs/github-issues.md","o":null},{"i":"docs_github_issues_hybrid_search","l":"하이브리드 검색 (정확 일치 + pg_trgm 키워드 + pgvector, RRF 결합)","t":"concept","c":0,"f":"docs/github-issues.md","o":null},{"i":"docs_github_issues_idempotent_ingestion","l":"멱등 수집 (문서 ID·버전·hash 기반 중복 방지)","t":"concept","c":0,"f":"docs/github-issues.md","o":null},{"i":"docs_github_issues_internal_material_approval","l":"내부 자료 공개 승인과 외부 모델 전송 승인 분리","t":"concept","c":0,"f":"docs/github-issues.md","o":null},{"i":"docs_github_issues_law_api_targets","l" const byId = new Map(DATA.nodes.map(n => [n.i, n]));
const deg = new Map();
DATA.links.forEach(l => {

});

  nbrs.get(l.s).push({o: l.d, r: l.r, c: l.c, dir: '→'});

    b.onclick = () => {
      active.comms.has(id) ? active.comms.delete(id) : active.comms.add(id);
      b.setAttribute('aria-pressed', String(active.comms.has(id)));
      apply();
    };
    commBtns.set(id, b);
    commsEl.appendChild(b);
  });
document.getElementById('all').onclick = () => {
  Object.keys(DATA.communities).forEach(c => active.comms.add(Number(c)));
  commBtns.forEach(b => b.setAttribute('aria-pressed', 'true'));
  apply();
};
document.getElementById('none').onclick = () => {
  active.comms.clear();
  commBtns.forEach(b => b.setAttribute('aria-pressed', 'false'));
  apply();
};

function commColor(cid) {
  const h = (Number(cid) * 47) % 360;
  return 'hsl(' + h + ' 34% 52%)';
}

// ---- hyperedges ----
const hyperEl = document.getElementById('hyper');
DATA.hyperedges.forEach(h => {
  const b = document.createElement('button');
  b.className = 'hbtn'; b.type = 'button';
  b.textContent = h.l + ' · ' + h.n.length;
  b.onclick = () => {
    const ids = h.n.filter(i => byId.has(i));
    if (!ids.length) return;
    net.selectNodes(ids);
    net.fit({nodes: ids, animation: !reduced});
    if (ids.length) showNode(ids[0]);
  };
  hyperEl.appendChild(b);
});

// ---- network ----
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const nodesDS = new vis.DataSet(DATA.nodes.map(n => ({
  id: n.i,
  label: (deg.get(n.i) || 0) >= 4
    ? (n.l.length > 26 ? n.l.slice(0, 25) + '…' : n.l)
    : undefined,
  title: n.l + (n.f ? '\n' + n.f + (n.n ? ':' + n.n : '') : ''),
  value: (deg.get(n.i) || 0) + 1,
  color: nodeColor(n),
  font: {color: css('--ink'), face: 'Noto Sans KR, sans-serif', size: 13}
})));
const edgesDS = new vis.DataSet(DATA.links.map((l, k) => ({
  id: k, from: l.s, to: l.d,
  title: l.r + ' · ' + l.c,
  dashes: l.c === 'INFERRED',
  color: {color: l.c === 'INFERRED' ? css('--edge-inferred') : css('--edge'),
          opacity: l.c === 'INFERRED' ? 0.75 : 0.5},
  width: l.c === 'INFERRED' ? 1.4 : 1
})));

function nodeColor(n) {
  const c = typeColor(n.t);
  return {background: c, border: c, highlight: {background: css('--accent-soft'), border: css('--ink')}};
}

const net = new vis.Network(document.getElementById('net'),
  {nodes: nodesDS, edges: edgesDS}, {
  nodes: {shape: 'dot', scaling: {min: 7, max: 34, label: {enabled: true, min: 11, max: 17}},
          borderWidth: 0},
  edges: {smooth: {type: 'continuous', roundness: 0.2}},
  physics: {enabled: true, stabilization: {iterations: 260, fit: true},
            barnesHut: {gravitationalConstant: -7200, springLength: 118,
                        springConstant: 0.035, damping: 0.42, avoidOverlap: 0.16}},
  interaction: {hover: true, tooltipDelay: 180, navigationButtons: false, keyboard: false}
});
net.once('stabilizationIterationsDone', () => net.setOptions({physics: {enabled: false}}));

// ---- filtering ----
function visible(n) {
  if (!active.types.has(n.t)) return false;
  if (!active.comms.has(n.c)) return false;
  if (active.q) {
    const hay = (n.l + ' ' + (n.f || '')).toLowerCase();
    if (!hay.includes(active.q)) return false;
  }
  return true;
}
function apply() {
  const shown = new Set();
  const nUpd = DATA.nodes.map(n => {
    const v = visible(n);
    if (v) shown.add(n.i);
    return {id: n.i, hidden: !v};
  });
  nodesDS.update(nUpd);
  edgesDS.update(DATA.links.map((l, k) => ({
    id: k,
    hidden: !(shown.has(l.s) && shown.has(l.d) && active.confs.has(l.c))
  })));
}
let qt;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(qt);
  qt = setTimeout(() => { active.q = e.target.value.trim().toLowerCase(); apply(); }, 160);
});

// ---- inspector ----
const insp = document.getElementById('insp');
net.on('click', (p) => {
  if (p.nodes.length) showNode(p.nodes[0]);
});

function showNode(id) {
  const n = byId.get(id);
  if (!n) return;
  net.selectNodes([id]);
  const list = (nbrs.get(id) || [])
    .filter(x => byId.has(x.o))
    .sort((a, b) => (deg.get(b.o) || 0) - (deg.get(a.o) || 0));

  const el = document.createElement('div');

  const h = document.createElement('h2');
  h.className = 'ntitle';
  h.textContent = n.l;
  el.appendChild(h);

  const badges = document.createElement('div');
  badges.className = 'badges';
  const tb = document.createElement('span');
  tb.className = 'badge type';
  tb.style.background = typeColor(n.t);
  tb.style.color = css('--on-accent');
  tb.textContent = TYPE_LABEL[n.t] || n.t;
  badges.appendChild(tb);
  const cb = document.createElement('span');
  cb.className = 'badge';
  cb.textContent = DATA.communities[n.c] || ('커뮤니티 ' + n.c);
  badges.appendChild(cb);
  const db = document.createElement('span');
  db.className = 'badge';
  db.textContent = '연결 ' + (deg.get(id) || 0);
  badges.appendChild(db);
  if (n.o === 'ast') {
    const ob = document.createElement('span');
    ob.className = 'badge';
    ob.textContent = 'AST 추출';
    badges.appendChild(ob);
  }
  el.appendChild(badges);

  if (n.f) {
    const m = document.createElement('p');
    m.className = 'meta';
    m.textContent = n.f + (n.n ? ' · ' + n.n : '');
    el.appendChild(m);
  }

  if (n.r) {
    const w = document.createElement('div');
    w.className = 'why';
    const wh = document.createElement('h3');
    wh.textContent = '설계 근거';
    w.appendChild(wh);
    const wp = document.createElement('div');
    wp.textContent = n.r;
    w.appendChild(wp);
    el.appendChild(w);
  }

  const rel = document.createElement('div');
  rel.className = 'rel';
  const rh = document.createElement('h3');
  rh.textContent = '연결된 노드 ' + list.length;
  rel.appendChild(rh);
  const ul = document.createElement('ul');
  list.forEach(x => {
    const li = document.createElement('li');
    const tag = document.createElement('span');
    tag.className = 'rl';
    tag.textContent = x.dir + ' ' + x.r;
    li.appendChild(tag);
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = byId.get(x.o).l;
    b.onclick = () => { showNode(x.o); net.focus(x.o, {scale: 1.1, animation: !reduced}); };
    li.appendChild(b);
    if (x.c === 'INFERRED') {
      const i = document.createElement('span');
      i.className = 'inf';
      i.textContent = '추론';
      li.appendChild(i);
    }
    ul.appendChild(li);
  });
  rel.appendChild(ul);
  el.appendChild(rel);

  insp.replaceChildren(el);
  insp.scrollTop = 0;
}

// ---- theme repaint ----
function repaint() {
  nodesDS.update(DATA.nodes.map(n => ({
    id: n.i, color: nodeColor(n),
    font: {color: css('--ink'), face: 'Noto Sans KR, sans-serif', size: 13}
  })));
  edgesDS.update(DATA.links.map((l, k) => ({
    id: k,
    color: {color: l.c === 'INFERRED' ? css('--edge-inferred') : css('--edge'),
            opacity: l.c === 'INFERRED' ? 0.75 : 0.5}
  })));
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(repaint, 60));
new MutationObserver(() => setTimeout(repaint, 60))
  .observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

// 첫 화면부터 무엇을 보는 그래프인지 드러나도록 가장 연결이 많은 노드를 열어 둡니다.
const seed = DATA.nodes.slice().sort((a, b) => (deg.get(b.i) || 0) - (deg.get(a.i) || 0))[0];
if (seed) showNode(seed.i);
</script>
